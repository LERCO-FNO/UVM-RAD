[project]
name = "uvm-rad-dataset-reader"
version = "0.1.0"
description = "Read-only Napari viewer for UVM-RAD DICOM images and RTSTRUCT contours"
requires-python = ">=3.10"
dependencies = [
    "napari>=0.7.1",
    "numpy>=2.2.6",
    "pydicom>=3.0",
    "pyside6>=6.12.0",
    "scikit-image>=0.25.2",
    "simpleitk>=2.5.6",
]

[tool.uv]
package = false
